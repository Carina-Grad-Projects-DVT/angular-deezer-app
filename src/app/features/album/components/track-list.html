<!-- TODO: Mobile friendly version -->
<div>
  <p-table [value]="tracks()" class="tracklist-table">
    <ng-template pTemplate="header">
      <tr>
        <th>Track #</th>
        <th>Name</th>
        <th>Duration</th>
        <th>Preview</th>
        <th>Playlist</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-track let-rowIndex="rowIndex">
      <tr>
        <td>{{ track.track_position || rowIndex + 1 }}</td>
        <td>{{ track.title }}</td>
        <td>{{ formatDuration(track.duration) }}</td>
        <td>
          @if (track.preview) {
            <audio controls preload="none" [src]="track.preview" class=""></audio>
          } @else {
            <span class="text-sm text-muted-color">No preview</span>
          }
        </td>
        <td>
          <p-splitbutton
            icon="pi pi-folder-plus"
            [model]="getPlaylistMenuItems(track.id)"
            [disabled]="!hasPlaylists()"
            styleClass="!bg-brand-green !text-black"
            menuButtonStyleClass="!bg-brand-green !text-black"
            (onClick)="onSplitButtonClick(track)"
          ></p-splitbutton>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="5" class="text-center">No tracks available.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
