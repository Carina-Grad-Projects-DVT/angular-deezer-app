<div>
  <p-table [value]="tracks()" [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template pTemplate="header">
      <tr>
        <th>Track #</th>
        <th>Name</th>
        <th>Duration</th>
        <th>Preview</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-track let-rowIndex="rowIndex">
      <tr>
        <td>{{ track.track_position || rowIndex + 1 }}</td>
        <td>{{ track.title }}</td>
        <td>{{ formatDuration(track.duration) }}</td>
        <td>
          @if (track.preview) {
            <audio controls preload="none" [src]="track.preview"></audio>
          } @else {
            <span class="text-sm text-muted-color">No preview</span>
          }
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="4" class="text-center">No tracks available.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
